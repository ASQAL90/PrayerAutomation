# Build portable + installer lalu unggah ke GitHub Release.
# Dijalankan manual: rilis normal dibangun lokal, dan tag dari GitHub API
# tetap memicu event push yang tidak kita inginkan di sini.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      # Use the MSVC Rust targets so no MinGW cross-linker is needed.
      - name: Publish portable x64
        run: dotnet publish src/PrayerAutomation.UI/PrayerAutomation.UI.csproj -c Release -p:Arch=x64 -r win-x64 -p:SelfContained=true -p:RustTarget=x86_64-pc-windows-msvc -o out/portable-x64

      - name: Publish portable x86
        run: dotnet publish src/PrayerAutomation.UI/PrayerAutomation.UI.csproj -c Release -p:Arch=x86 -r win-x86 -p:SelfContained=true -p:RustTarget=i686-pc-windows-msvc -o out/portable-x86

      - name: Receipt portable x64
        shell: pwsh
        run: python installer/make_payload_receipt.py --source out/portable-x64 --arch x64 --output out/receipt-x64.json

      - name: Receipt portable x86
        shell: pwsh
        run: python installer/make_payload_receipt.py --source out/portable-x86 --arch x86 --output out/receipt-x86.json

      - name: Build NSIS installer
        shell: pwsh
        env:
          AYOJAMAAH_OUT: out
        run: |
          $env:PATH = "$env:PATH;C:\Program Files (x86)\NSIS"
          python installer/build_installer_nsis.py

      - name: Package ZIPs
        shell: pwsh
        run: |
          $version = (Select-Xml -Path src/PrayerAutomation.UI/PrayerAutomation.UI.csproj -XPath '//Version').Node.InnerText
          $installer = "out/installer/AyoJamaah.Setup-$version.exe"
          $installerZip = "AyoJamaah.Setup-$version.zip"
          Compress-Archive -Path out/portable-x64/* -DestinationPath AyoJamaah-win-x64.zip -Force
          Compress-Archive -Path out/portable-x86/* -DestinationPath AyoJamaah-win-x86.zip -Force
          Compress-Archive -Path $installer -DestinationPath $installerZip -Force
          $lines = foreach ($f in @('AyoJamaah-win-x64.zip','AyoJamaah-win-x86.zip',$installer,$installerZip)) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)"
          }
          $lines | Out-File -Encoding ascii SHA256SUMS.txt

      - name: Build signed delta payloads
        shell: pwsh
        env:
          AYOJAMAAH_UPDATE_SIGNING_KEY_B64: ${{ secrets.AYOJAMAAH_UPDATE_SIGNING_KEY_B64 }}
        run: |
          $env:PATH = "$env:PATH;C:\Program Files\Git\usr\bin"
          $version = (Select-Xml -Path src/PrayerAutomation.UI/PrayerAutomation.UI.csproj -XPath '//Version').Node.InnerText
          python installer/build_update_payload.py --version $version --arch x64 `
            --source out/portable-x64 `
            --baseline installer/update/baseline-2.3.0-x64.json `
            --portable-zip AyoJamaah-win-x64.zip `
            --installer out/installer/AyoJamaah.Setup-$version.exe `
            --output-dir out/update
          python installer/build_update_payload.py --version $version --arch x86 `
            --source out/portable-x86 `
            --baseline installer/update/baseline-2.3.0-x86.json `
            --portable-zip AyoJamaah-win-x86.zip `
            --installer out/installer/AyoJamaah.Setup-$version.exe `
            --output-dir out/update

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AyoJamaah-release
          path: |
            AyoJamaah-win-x64.zip
            AyoJamaah-win-x86.zip
            out\installer\AyoJamaah.Setup-*.exe
            AyoJamaah.Setup-*.zip
            out\update\AyoJamaah-*.json
            out\update\AyoJamaah-*.sig
            out\update\AyoJamaah-delta-*.zip
            SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AyoJamaah-win-x64.zip
            AyoJamaah-win-x86.zip
            out\installer\AyoJamaah.Setup-*.exe
            AyoJamaah.Setup-*.zip
            out\update\AyoJamaah-*.json
            out\update\AyoJamaah-*.sig
            out\update\AyoJamaah-delta-*.zip
            SHA256SUMS.txt
          generate_release_notes: true
