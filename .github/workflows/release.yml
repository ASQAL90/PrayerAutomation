# Build portable + installer lalu unggah ke GitHub Release.
# Dijalankan manual: rilis normal dibangun lokal, dan tag dari GitHub API
# tetap memicu event push yang tidak kita inginkan di sini.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    # Lindungi artefak rilis: konfigurasikan environment ini dengan required
    # reviewers dan secret signing di level environment, bukan level repo.
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validasi catatan rilis
        shell: pwsh
        run: |
          $version = (Select-Xml -Path src/PrayerAutomation.UI/PrayerAutomation.UI.csproj -XPath '//Version').Node.InnerText
          $notes = "docs/release-notes/$version.md"
          if (-not (Test-Path $notes)) { throw "Catatan rilis $notes tidak ditemukan." }
          $text = Get-Content $notes -Raw
          if ($text -notmatch '(?m)^## (Fitur baru|Perbaikan|Perubahan|Catatan)' -or $text -notmatch '(?m)^- ') {
            throw "Catatan rilis $notes tidak memuat bagian dan poin yang dikenali."
          }
          "NOTES_PATH=$notes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      # Use the MSVC Rust targets so no MinGW cross-linker is needed.
      - name: Publish portable x64
        run: dotnet publish src/PrayerAutomation.UI/PrayerAutomation.UI.csproj -c Release -p:Arch=x64 -r win-x64 -p:SelfContained=true -p:RustTarget=x86_64-pc-windows-msvc -o out/portable-x64

      - name: Publish portable x86
        run: dotnet publish src/PrayerAutomation.UI/PrayerAutomation.UI.csproj -c Release -p:Arch=x86 -r win-x86 -p:SelfContained=true -p:RustTarget=i686-pc-windows-msvc -o out/portable-x86

      - name: Prune portable x64
        shell: pwsh
        run: python installer/prune_publish.py --source out/portable-x64 --arch x64 --report out/prune-x64.json

      - name: Prune portable x86
        shell: pwsh
        run: python installer/prune_publish.py --source out/portable-x86 --arch x86 --report out/prune-x86.json

      - name: Receipt portable x64
        shell: pwsh
        run: python installer/make_payload_receipt.py --source out/portable-x64 --arch x64 --output out/receipt-x64.json

      - name: Receipt portable x86
        shell: pwsh
        run: python installer/make_payload_receipt.py --source out/portable-x86 --arch x86 --output out/receipt-x86.json

      - name: Build NSIS installers
        shell: pwsh
        env:
          AYOJAMAAH_OUT: out
        run: |
          $env:PATH = "$env:PATH;C:\Program Files (x86)\NSIS"
          foreach ($variant in @('universal', 'x64', 'x86')) {
            python installer/build_installer_nsis.py --variant $variant
            if ($LASTEXITCODE -ne 0) { throw "Installer $variant gagal." }
          }

      - name: Package ZIPs
        shell: pwsh
        run: |
          $version = (Select-Xml -Path src/PrayerAutomation.UI/PrayerAutomation.UI.csproj -XPath '//Version').Node.InnerText
          $root = (Get-Location).Path
          $installers = @(
            "out/installer/AyoJamaah.Setup-$version.exe",
            "out/installer/AyoJamaah.Setup-$version-x64.exe",
            "out/installer/AyoJamaah.Setup-$version-x86.exe"
          )
          $zips = @("AyoJamaah-win-x64.zip", "AyoJamaah-win-x86.zip")
          Push-Location out/portable-x64
          7z a -tzip -mx=9 (Join-Path $root "AyoJamaah-win-x64.zip") *
          Pop-Location
          Push-Location out/portable-x86
          7z a -tzip -mx=9 (Join-Path $root "AyoJamaah-win-x86.zip") *
          Pop-Location
          foreach ($installer in $installers) {
            $installerZip = (Split-Path $installer -Leaf) -replace '\.exe$', '.zip'
            Compress-Archive -Path $installer -DestinationPath $installerZip -Force
            $zips += $installerZip
          }
          $lines = foreach ($f in ($zips + $installers)) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)"
          }
          $lines | Out-File -Encoding ascii SHA256SUMS.txt

      - name: Build signed delta payloads
        shell: pwsh
        env:
          AYOJAMAAH_UPDATE_SIGNING_KEY_B64: ${{ secrets.AYOJAMAAH_UPDATE_SIGNING_KEY_B64 }}
        run: |
          $env:PATH = "$env:PATH;C:\Program Files\Git\usr\bin"
          $version = (Select-Xml -Path src/PrayerAutomation.UI/PrayerAutomation.UI.csproj -XPath '//Version').Node.InnerText
          python installer/build_update_payload.py --version $version --arch x64 `
            --source out/portable-x64 `
            --baseline installer/update/baseline-2.3.0-x64.json `
            --portable-zip AyoJamaah-win-x64.zip `
            --installer out/installer/AyoJamaah.Setup-$version-x64.exe `
            --output-dir out/update `
            --require-signature
          python installer/build_update_payload.py --version $version --arch x86 `
            --source out/portable-x86 `
            --baseline installer/update/baseline-2.3.0-x86.json `
            --portable-zip AyoJamaah-win-x86.zip `
            --installer out/installer/AyoJamaah.Setup-$version-x86.exe `
            --output-dir out/update `
            --require-signature

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # actions/upload-artifact@v4
        with:
          name: AyoJamaah-release
          path: |
            AyoJamaah-win-x64.zip
            AyoJamaah-win-x86.zip
            out\installer\AyoJamaah.Setup-*.exe
            AyoJamaah.Setup-*.zip
            out\update\AyoJamaah-*.json
            out\update\AyoJamaah-*.sig
            out\update\AyoJamaah-delta-*.zip
            SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # softprops/action-gh-release@v2
        with:
          body_path: ${{ env.NOTES_PATH }}
          files: |
            AyoJamaah-win-x64.zip
            AyoJamaah-win-x86.zip
            out\installer\AyoJamaah.Setup-*.exe
            AyoJamaah.Setup-*.zip
            out\update\AyoJamaah-*.json
            out\update\AyoJamaah-*.sig
            out\update\AyoJamaah-delta-*.zip
            SHA256SUMS.txt
