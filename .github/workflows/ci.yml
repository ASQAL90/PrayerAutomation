name: CI

on:
  push:
  workflow_dispatch:

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test --workspace --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
